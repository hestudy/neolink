services:
  # PostgreSQL 数据库 with pgvector
  postgres:
    image: pgvector/pgvector:pg15
    container_name: neolink-postgres-dev
    environment:
      POSTGRES_DB: neolink
      POSTGRES_USER: neolink
      POSTGRES_PASSWORD: neolink_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neolink -d neolink']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: neolink-redis-dev
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: neolink-dev-network
